<html lang="ru">
<head>

<title>byBag v1.3.0</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff9a5a'/%3E%3Cstop offset='100%25' stop-color='%23ff6b8a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='42' fill='url(%23g)'/%3E%3Ctext x='90' y='128' font-size='100' text-anchor='middle' fill='white'%3E%F0%9F%A7%B3%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ff9a5a">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html{overflow-x:hidden;width:100%}
html,body{transition:background-color .35s ease,color .35s ease}
:root{--bg:#faf6f0;--text:#2d2419;--text-2:#8a7d6d;--text-3:#a0917e;--card:rgba(255,255,255,.7);--card-solid:#fff;--border:rgba(255,255,255,.9);--border-soft:rgba(180,130,90,.15);--accent-1:#ff9a5a;--accent-2:#ff6b8a;--success:#2f9c53;--danger:#d6336c;--shadow:rgba(180,130,90,.15);--glow-1:rgba(255,180,120,.35);--glow-2:rgba(255,130,150,.28)}
body.dark{--bg:#0d1220;--text:#e8ecf5;--text-2:#8891a8;--text-3:#6a7391;--card:rgba(30,38,60,.65);--card-solid:#1a2138;--border:rgba(120,150,220,.15);--border-soft:rgba(120,150,220,.12);--accent-1:#6b8cff;--accent-2:#a06bff;--success:#3ddc84;--danger:#ff5e8a;--shadow:rgba(0,0,0,.5);--glow-1:rgba(80,100,220,.35);--glow-2:rgba(140,80,220,.25)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);overflow-x:hidden;width:100%;padding-bottom:140px;position:relative}
body::before,body::after{content:'';position:fixed;width:80%;height:60%;border-radius:50%;pointer-events:none;z-index:-10;filter:blur(40px);transition:background .35s ease}
body::before{top:-20%;left:-20%;background:radial-gradient(circle,var(--glow-1),transparent 65%)}
body::after{bottom:-20%;right:-20%;background:radial-gradient(circle,var(--glow-2),transparent 65%)}
.app-header{position:fixed;top:0;left:0;right:0;padding:14px 24px 10px;z-index:60;background:linear-gradient(to bottom,var(--bg) 70%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:center;width:100%}
.app-header .logo{font-size:26px;font-weight:800;letter-spacing:-.6px;display:inline-block;background:linear-gradient(135deg,#ff9a5a,#ff6b8a 50%,#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.dark .app-header .logo{background:linear-gradient(135deg,#6b8cff,#a06bff 50%,#ff6bcb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header-spacer{height:60px}
.container{padding:0 20px;max-width:500px;margin:0 auto;position:relative;z-index:1;width:100%}
.stories-wrap{margin:6px 0 20px}
.stories-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);font-weight:700;margin-bottom:10px;padding-left:4px}
.stories-row{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.stories-row::-webkit-scrollbar{display:none}
.story-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:74px}
.story-ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg,#ff9a5a,#ff6b8a,#c084fc,#5ec7ff,#ff9a5a);position:relative;transition:transform .25s}
body.dark .story-ring{background:conic-gradient(from 180deg,#6b8cff,#a06bff,#ff6bcb,#3ddc84,#6b8cff)}
.story-item:active .story-ring{transform:scale(.94)}
.story-ring.viewed{background:var(--border-soft)}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(--card-solid);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;border:2px solid var(--bg);position:relative}
.story-inner .story-badge{position:absolute;bottom:2px;right:2px;font-size:14px;width:22px;height:22px;border-radius:50%;background:var(--card-solid);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.story-item .story-label{font-size:10.5px;font-weight:600;color:var(--text-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px;line-height:1.2}
.story-viewer{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
.story-viewer.active{display:flex}
.story-progress-row{position:absolute;top:14px;left:12px;right:12px;display:flex;gap:4px;z-index:10}
.story-progress-bar{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.story-progress-fill{height:100%;background:#fff;width:0%;transition:width .05s linear}
.story-progress-bar.done .story-progress-fill{width:100%}
.story-header{position:absolute;top:28px;left:16px;right:16px;display:flex;align-items:center;gap:12px;z-index:10;color:#fff}
.story-avatar-sm{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid rgba(255,255,255,.5)}
.story-name-block{flex:1;min-width:0}
.story-name-block .s-title{font-size:15px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.story-name-block .s-time{font-size:12px;opacity:.8;font-weight:500}
.story-close-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0}
.story-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 30px 140px;text-align:center;position:relative;overflow-y:auto}
.story-big-emoji{font-size:120px;margin-bottom:24px;line-height:1;animation:storyZoom .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes storyZoom{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.story-content h2{color:#fff;font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.4);animation:storyFade .8s .2s both}
.story-content p{color:rgba(255,255,255,.85);font-size:15px;line-height:1.5;margin-bottom:6px;max-width:320px;animation:storyFade .8s .35s both}
@keyframes storyFade{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
.story-stats{display:flex;gap:24px;margin-top:30px;animation:storyFade .8s .5s both}
.story-stat{text-align:center}
.story-stat .s-val{color:#fff;font-size:32px;font-weight:800;line-height:1;margin-bottom:6px;letter-spacing:-.5px}
.story-stat .s-lbl{color:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.story-bg{position:absolute;inset:0;z-index:0;opacity:.4}
.story-bg::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,.7) 100%)}
.story-emoji-deco{position:absolute;font-size:300px;line-height:1;opacity:.08;pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%)}
.story-tap-zone{position:absolute;top:60px;bottom:0;width:30%;z-index:5;cursor:pointer}
.story-tap-zone.prev{left:0}
.story-tap-zone.next{right:0;width:50%} 
.main-widget{position:relative;border-radius:28px;overflow:hidden;cursor:pointer;background:var(--card-solid);box-shadow:0 18px 45px var(--shadow);display:flex;flex-direction:column;width:100%}
.main-widget:active{transform:scale(.985)}
.widget-hero{position:relative;padding:25px 23px 44px;overflow:hidden;background:linear-gradient(135deg,var(--c1,#ffb347),var(--c2,#ff7e5f))}
.widget-hero .bg-emoji{position:absolute;right:-17px;bottom:-36px;font-size:162px;line-height:1;opacity:.22;pointer-events:none;transform:rotate(-12deg);user-select:none}
.widget-hero::before{content:'';position:absolute;top:-54px;left:-54px;width:162px;height:162px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;margin-bottom:21px}
.hero-label{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.35);border-radius:100px;font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#fff}
.hero-label .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.hero-close{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.35);color:#fff;width:32px;height:32px;border-radius:50%;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;padding:0}
.hero-title{position:relative;z-index:2}
.hero-title h2{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.7px;line-height:1.1;margin-bottom:7px;text-shadow:0 2px 12px rgba(0,0,0,.15);word-break:break-word}
.hero-title .hero-date{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.9);font-weight:600;flex-wrap:wrap}
.hero-countdown,.hero-weight{display:inline-block;padding:2px 8px;background:rgba(255,255,255,.25);border-radius:100px;font-size:11px;color:#fff;font-weight:600}
.complete-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(255,255,255,.9);border-radius:100px;font-size:10.5px;font-weight:700;color:var(--success);margin-bottom:10px;position:relative;z-index:2}
.widget-body{background:var(--card-solid);margin-top:-27px;border-radius:28px;padding:24px 22px 22px;position:relative;z-index:3;display:flex;align-items:center;gap:18px}
.ring-wrap{position:relative;width:100px;height:100px;flex-shrink:0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border-soft);stroke-width:9}
.ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1),stroke .4s ease}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring-percent{font-size:24px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-1px}
.ring-percent .sign{font-size:13px;font-weight:700;color:var(--text-3)}
.widget-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.meta-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--border-soft)}
.meta-row:last-child{border-bottom:none;padding-bottom:0}
.meta-row .meta-key{font-size:11.5px;color:var(--text-3);font-weight:600}
.meta-row .meta-val{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.meta-row .meta-val.done{color:var(--success)}
.meta-row .meta-val.left{color:var(--accent-2)}
.widget-footer{padding:0 22px 20px;background:var(--card-solid);position:relative;z-index:3}
.mini-bar{height:6px;background:var(--border-soft);border-radius:10px;overflow:hidden;margin-bottom:12px}
.mini-bar .fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.tap-hint{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.tap-hint .arrow{font-size:14px;color:var(--text-3)}
.trips-carousel{position:relative;overflow:hidden;margin-bottom:8px;margin-top:6px;border-radius:28px}
.trips-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform}
.trips-track .main-widget{flex:0 0 100%;margin:0}
.trips-dots{display:flex;justify-content:center;gap:6px;padding:14px 0 0}
.trips-dots .tdot{width:8px;height:8px;border-radius:50%;background:var(--border-soft);transition:all .25s;cursor:pointer}
.trips-dots .tdot.active{width:24px;border-radius:100px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2))}
.swipe-hint{text-align:center;font-size:11px;color:var(--text-3);font-weight:600;padding:6px 0 0;opacity:.6;animation:swipeHintFade 4s ease forwards}
@keyframes swipeHintFade{0%,70%{opacity:.6}100%{opacity:0}}
.add-trip-btn{width:100%;padding:18px;border:none;border-radius:22px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 30px rgba(255,107,138,.4),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:20px;margin-top:8px}
.add-trip-btn:active{transform:scale(.97)}
.add-trip-btn .plus{font-size:22px;line-height:1;font-weight:300}
.plus-one{position:fixed;font-size:22px;font-weight:800;color:var(--success);pointer-events:none;z-index:900;animation:plusOneFloat 1s ease-out forwards}
@keyframes plusOneFloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-70px) scale(.9);opacity:0}}
.empty-hero{padding:40px 28px;margin:6px 0 17px;background:var(--card);border:1.5px dashed rgba(255,154,90,.4);border-radius:28px;text-align:center;cursor:pointer}
body.dark .empty-hero{border-color:rgba(107,140,255,.4)}
.empty-hero .empty-icon{font-size:64px;margin-bottom:14px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty-hero h2{font-size:20px;font-weight:800;color:var(--text);margin-bottom:8px}
.empty-hero p{font-size:14px;color:var(--text-2);line-height:1.5;margin-bottom:18px;font-weight:500}
.empty-hero .empty-cta{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));color:#fff;font-size:14.5px;font-weight:700;border-radius:100px}
.empty-hero .empty-cta .plus{font-size:18px;line-height:1;font-weight:300}
.stats-section{margin-bottom:20px}
.stats-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);font-weight:700;margin-bottom:12px;padding-left:4px}
.history-item,.my-list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 14px var(--shadow);margin-bottom:8px}
.history-item .h-emoji,.my-list-item .ml-emoji{font-size:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card-solid);border-radius:12px;flex-shrink:0}
.history-item .h-body,.my-list-item .ml-body{flex:1;min-width:0}
.history-item .h-body .h-name,.my-list-item .ml-body .ml-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item .h-body .h-meta,.my-list-item .ml-body .ml-meta{font-size:11.5px;color:var(--text-3);font-weight:500}
.history-item .h-badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:10px;background:rgba(78,203,113,.15);color:var(--success);flex-shrink:0}
body.dark .history-item .h-badge{background:rgba(61,220,132,.15)}
.icon-btn{background:transparent;border:none;color:var(--text-3);width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;padding:0;opacity:.5}
.profile-hero{padding:24px;background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:0 16px 40px var(--shadow);display:flex;align-items:center;gap:18px;margin-bottom:20px;margin-top:6px;position:relative;overflow:hidden}
.profile-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--glow-1),transparent 70%);pointer-events:none}
.profile-avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;position:relative;z-index:1;color:#fff;font-weight:700;overflow:hidden;background-size:cover;background-position:center;cursor:pointer}
.profile-avatar.has-photo{color:transparent}
.profile-avatar .avatar-edit{position:absolute;bottom:0;right:0;width:28px;height:28px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--bg)}
.profile-avatar .avatar-edit svg{width:13px;height:13px;fill:#fff}
.profile-info{flex:1;min-width:0;position:relative;z-index:1}
.profile-info h2{font-size:21px;font-weight:800;color:var(--text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:linear-gradient(135deg,rgba(255,154,90,.2),rgba(255,107,138,.2));border:1px solid rgba(255,154,90,.4);border-radius:100px;font-size:11px;font-weight:700;color:var(--danger)}
body.dark .profile-badge{background:linear-gradient(135deg,rgba(107,140,255,.2),rgba(160,107,255,.2));border-color:rgba(107,140,255,.5);color:#a9bdff}
.profile-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.profile-stat-card{padding:18px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 6px 20px var(--shadow)}
.profile-stat-card .ps-icon{font-size:22px;margin-bottom:8px}
.profile-stat-card .ps-num{font-size:26px;font-weight:800;color:var(--text);line-height:1;margin-bottom:4px;letter-spacing:-.5px}
.profile-stat-card .ps-label{font-size:12px;color:var(--text-3);font-weight:600}
.profile-menu{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 8px 32px var(--shadow);overflow:hidden;margin-bottom:20px}
.profile-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.profile-item:last-child{border-bottom:none}
.profile-item:active{background:rgba(255,154,90,.08)}
.profile-item .pi-icon{font-size:20px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(255,154,90,.13);border-radius:12px;flex-shrink:0}
body.dark .profile-item .pi-icon{background:rgba(107,140,255,.15)}
.profile-item .pi-label{flex:1;font-size:15px;font-weight:600;color:var(--text)}
.profile-item .pi-value{font-size:14px;color:var(--text-3);font-weight:600}
.profile-item .pi-arrow{color:var(--text-3);font-size:16px;font-weight:700;opacity:.5}
.achievements-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
.achievement{padding:16px 14px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 6px 20px var(--shadow);text-align:center;opacity:.4;filter:grayscale(1)}
.achievement.unlocked{opacity:1;filter:grayscale(0);background:linear-gradient(135deg,rgba(255,154,90,.15),rgba(255,107,138,.15));border-color:rgba(255,154,90,.4)}
